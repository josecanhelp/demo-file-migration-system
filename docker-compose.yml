services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sourcedb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/conf:/etc/mysql/conf.d
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      # -h 127.0.0.1 forces a real TCP connection on port 3306, unlike
      # -h localhost, which mysqladmin resolves to the unix socket and
      # which the entrypoint's temporary startup server answers on well
      # before the real server is listening on TCP. Checking the socket
      # alone lets service_healthy fire before anything can actually
      # connect to the database over the network.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: targetdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d targetdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # One-shot bucket setup. Runs mc against minio, creates the documents
  # bucket, then exits. Lets a fresh `docker compose up` skip any manual
  # bucket creation step.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/documents &&
      exit 0
      "

  # Single-broker Kafka in KRaft mode (no Zookeeper). Dual listeners: PLAINTEXT
  # on the compose network for other services (kafka:9092), PLAINTEXT_HOST
  # mapped to the host port for anything connecting from outside the
  # compose network (localhost:9092).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Fake vendor OCR API with chaos controls. Long-running and part of a plain
  # `docker compose up`, since migration workers depend on it being reachable.
  # POST /admin/mode flips it into a failure mode at runtime to exercise the
  # circuit breaker; the starting mode comes from VENDOR_FAILURE_MODE.
  vendor-mock:
    build: ./services/vendor-mock
    container_name: vendor-mock
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      PORT: 8088
      VENDOR_RATE_LIMIT_RPS: ${VENDOR_RATE_LIMIT_RPS:-50}
      VENDOR_BATCH_SIZE: ${VENDOR_BATCH_SIZE:-25}
      VENDOR_LATENCY_MS: ${VENDOR_LATENCY_MS:-150}
      VENDOR_FAILURE_MODE: ${VENDOR_FAILURE_MODE:-healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8088/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Populates sourcedb.files with synthetic documents. Runs as part of a
  # plain `docker compose up`, gating migrator-coordinator so a cold start
  # always has source rows to plan a backfill from with no manual steps.
  # It tops the table up to its target row count rather than duplicating
  # rows, so running it again on every subsequent `up` is safe.
  seeder:
    build: ./services/seeder
    container_name: seeder
    # Backstops the connect-retry loop inside the seeder itself: if MySQL
    # was genuinely not ready yet despite passing its healthcheck, and the
    # seeder's own retries still ran out, restarting the container gives
    # it a fresh set of attempts rather than leaving migrator-coordinator
    # gated forever on a service that already gave up.
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: sourcedb
      SEED_FILE_COUNT: ${SEED_FILE_COUNT:-500}
      SEED_FILE_SIZE_BYTES: ${SEED_FILE_SIZE_BYTES:-2048}
      SEED_BATCH_SIZE: ${SEED_BATCH_SIZE:-500}
      SEED_PROGRESS_LOG_INTERVAL: ${SEED_PROGRESS_LOG_INTERVAL:-5000}
      SEED_CONNECT_RETRIES: ${SEED_CONNECT_RETRIES:-30}

  # Migrator image, built once and run twice under different profiles. The
  # worker profile consumes the backfill topic and runs each batch of ids
  # through to a document row and object; the coordinator profile plans
  # backfill ranges and publishes their ids to that topic.
  migrator-worker:
    build: ./services/migrator
    container_name: migrator-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: sourcedb
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: targetdb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      MINIO_REGION: us-east-1
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-0}
      CLAIM_LEASE_SECONDS: ${CLAIM_LEASE_SECONDS:-60}
      CLAIM_RENEW_INTERVAL_SECONDS: ${CLAIM_RENEW_INTERVAL_SECONDS:-10}
      VENDOR_BASE_URL: ${VENDOR_BASE_URL:-http://vendor-mock:8088}
      VENDOR_CONNECT_TIMEOUT_MS: ${VENDOR_CONNECT_TIMEOUT_MS:-2000}
      VENDOR_READ_TIMEOUT_MS: ${VENDOR_READ_TIMEOUT_MS:-10000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      BACKFILL_TOPIC_PARTITIONS: ${BACKFILL_TOPIC_PARTITIONS:-3}
      BACKFILL_NACK_BACKOFF_SECONDS: ${BACKFILL_NACK_BACKOFF_SECONDS:-30}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrator-coordinator:
    build: ./services/migrator
    container_name: migrator-coordinator
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: coordinator
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: sourcedb
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: targetdb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: documents
      MINIO_REGION: us-east-1
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-0}
      CLAIM_LEASE_SECONDS: ${CLAIM_LEASE_SECONDS:-60}
      CLAIM_RENEW_INTERVAL_SECONDS: ${CLAIM_RENEW_INTERVAL_SECONDS:-10}
      VENDOR_BASE_URL: ${VENDOR_BASE_URL:-http://vendor-mock:8088}
      VENDOR_CONNECT_TIMEOUT_MS: ${VENDOR_CONNECT_TIMEOUT_MS:-2000}
      VENDOR_READ_TIMEOUT_MS: ${VENDOR_READ_TIMEOUT_MS:-10000}
      VENDOR_BATCH_SIZE: ${VENDOR_BATCH_SIZE:-25}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      BACKFILL_TOPIC_PARTITIONS: ${BACKFILL_TOPIC_PARTITIONS:-3}
      BACKFILL_RANGE_SIZE: ${BACKFILL_RANGE_SIZE:-1000}
      BACKFILL_RANGE_LEASE_SECONDS: ${BACKFILL_RANGE_LEASE_SECONDS:-300}
      BACKFILL_PLAN_INTERVAL_SECONDS: ${BACKFILL_PLAN_INTERVAL_SECONDS:-30}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
  postgres-data:
  minio-data:
  kafka-data:
