server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: migrator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    admin:
      fail-fast: false
      operation-timeout: 30s
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual_immediate

migrator:
  worker-concurrency: ${WORKER_CONCURRENCY:8}
  db-pool-size: ${DB_POOL_SIZE:0}
  claim-lease-seconds: ${CLAIM_LEASE_SECONDS:60}
  claim-renew-interval-seconds: ${CLAIM_RENEW_INTERVAL_SECONDS:10}
  max-retry-attempts: ${MAX_RETRY_ATTEMPTS:5}
  backfill:
    range-size: ${BACKFILL_RANGE_SIZE:1000}
    range-lease-seconds: ${BACKFILL_RANGE_LEASE_SECONDS:300}
    plan-interval-seconds: ${BACKFILL_PLAN_INTERVAL_SECONDS:30}
    nack-backoff-seconds: ${BACKFILL_NACK_BACKOFF_SECONDS:30}
    topic: files.backfill
    topic-partitions: ${BACKFILL_TOPIC_PARTITIONS:3}
    group-id: backfill
  cdc:
    topic: cdc.sourcedb.files
    topic-partitions: ${CDC_TOPIC_PARTITIONS:3}
    group-id: cdc
    nack-backoff-seconds: ${CDC_NACK_BACKOFF_SECONDS:10}
    reserved-rate-pct: ${CDC_RESERVED_RATE_PCT:20}
  dlq:
    topic: files.dlq
    topic-partitions: ${DLQ_TOPIC_PARTITIONS:3}
  breaker:
    failure-rate-threshold: ${BREAKER_FAILURE_RATE_THRESHOLD:50}
    open-duration-seconds: ${BREAKER_OPEN_DURATION_SECONDS:10}
  governor:
    retry-base-backoff-ms: ${GOVERNOR_RETRY_BASE_BACKOFF_MS:200}
  mysql:
    host: ${MYSQL_HOST:mysql}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:sourcedb}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  postgres:
    host: ${POSTGRES_HOST:postgres}
    port: ${POSTGRES_PORT:5432}
    database: ${POSTGRES_DATABASE:targetdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  object-store:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:documents}
    region: ${MINIO_REGION:us-east-1}
  vendor:
    base-url: ${VENDOR_BASE_URL:http://vendor-mock:8088}
    connect-timeout-ms: ${VENDOR_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${VENDOR_READ_TIMEOUT_MS:10000}
    batch-size: ${VENDOR_BATCH_SIZE:25}
    rate-limit-rps: ${VENDOR_RATE_LIMIT_RPS:50}
  reconcile:
    batch-size: ${RECONCILE_BATCH_SIZE:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
